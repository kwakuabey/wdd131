<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A responsive temple album featuring temples from around the world.">
    <meta name="author" content="Bright Abbey">
    <title>Temple Album | Bright Abbey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">
    <script src="scripts/temples.js" defer></script>

</head>

<body>


    <header class="site-header">

        <a class="brand" href="temples.html">
            Temple Album
        </a>


        <button class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false"
            aria-controls="primary-nav">

            <span class="menu-icon" aria-hidden="true">☰</span>

        </button>


        <nav class="primary-nav" id="primary-nav" aria-label="Main navigation">

            <a href="#home">Home</a>
            <a href="#old">Old</a>
            <a href="#new">New</a>
            <a href="#large">Large</a>
            <a href="#small">Small</a>

        </nav>

    </header>


    <main id="home" class="page-main">

        <section class="intro">

            <h1>Temple Album</h1>

        </section>



        <section class="album" aria-label="Temple photo album">


            <figure id="old" class="temple-card">

                <div class="photo-wrap">

                    <img src="images/temples/temple1.jpg" alt="Temple building" loading="eager">

                </div>

                <figcaption>

                    <span class="caption-title">
                        01-Billings Montana Temple
                    </span>

                </figcaption>

            </figure>



            <figure id="new" class="temple-card">

                <div class="photo-wrap">

                    <img src="images/temples/temple2.jpg" alt="Temple building" loading="lazy">

                </div>

                <figcaption>

                    <span class="caption-title">
                        1-Boise Idaho Temple
                    </span>

                </figcaption>

            </figure>



            <figure class="temple-card">

                <div class="photo-wrap">

                    <img src="images/temples/temple3.jpg" alt="Temple building" loading="lazy">

                </div>

                <figcaption>

                    <span class="caption-title">
                        Atlanta Temple
                    </span>

                </figcaption>

            </figure>



            <figure class="temple-card">

                <div class="photo-wrap">

                    <img src="images/temples/temple4.jpg" alt="Accra Ghana Temple" loading="lazy">

                </div>

                <figcaption>

                    <span class="caption-title">
                        Belem Brazil Temple
                    </span>

                </figcaption>

            </figure>



            <figure class="temple-card">

                <div class="photo-wrap">

                    <img src="images/temples/temple5.jpg" alt="Rome Italy Temple" loading="lazy">

                </div>

                <figcaption>

                    <span class="caption-title">
                        Bern Switzerland Temple
                    </span>

                </figcaption>

            </figure>



            <figure class="temple-card">

                <div class="photo-wrap">

                    <img src="images/temples/temple6.jpg" alt="Cebu Philippines Temple" loading="lazy">

                </div>

                <figcaption>

                    <span class="caption-title">
                        New Mexico Temple
                    </span>

                </figcaption>

            </figure>



            <figure id="large" class="temple-card">

                <div class="photo-wrap">

                    <img src="images/temples/temple7.jpg" alt="Paris France Temple" loading="lazy">

                </div>

                <figcaption>

                    <span class="caption-title">
                        Nigeria Aba Temple
                    </span>

                </figcaption>

            </figure>



            <figure class="temple-card">

                <div class="photo-wrap">

                    <img src="images/temples/temple8.jpeg" alt="Nauvoo Illinois Temple" loading="lazy">

                </div>

                <figcaption>

                    <span class="caption-title">
                        Paraguay Temple
                    </span>

                </figcaption>

            </figure>


            <figure id="small" class="temple-card">

                <div class="photo-wrap">

                    <img src="images/temples/temple9.jpeg" alt="Freetown Sierra Leone Temple" loading="lazy">

                </div>

                <figcaption>

                    <span class="caption-title">
                        Peru Temple
                    </span>

                </figcaption>

            </figure>

        </section>

    </main>



    <footer class="site-footer">

        <p>
            © <span id="current-year"></span>
            Bright Abbey | Ghana
        </p>

        <p id="last-modified"></p>

    </footer>


</body>

</html>
